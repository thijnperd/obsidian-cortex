name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (Rust)
        run: cargo test --workspace --all-targets --locked
      - name: Repo hygiene & module check
        run: node tools/check-repo.mjs
      - name: Test (Web JS)
        run: node --test tests/*.test.mjs

  smoke:
    name: web smoke (playwright)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build cortex
        run: cargo build --release -p cortex --locked
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --prefix /tmp/pw playwright
          /tmp/pw/node_modules/.bin/playwright install chromium --with-deps
      - name: Run headless smoke test
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: node tests/smoke.mjs --bin target/release/cortex

  # Linux and Windows only. macOS runners are the scarce resource on this
  # account, and `release.yml` already builds and tests macOS on every push to
  # main; asking for a second one here starves the release job, which then sits
  # queued until the next push supersedes it.
  build:
    name: build (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p cortex --locked
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ matrix.target }}
          path: |
            target/release/cortex
            target/release/cortex.exe
          if-no-files-found: error
          retention-days: 14

  pages:
    name: demo → github pages
    needs: [check, smoke]
    # Pages builds from Actions, so every push to main refreshes the live demo.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Seed demo vault
        run: cargo run --release -p cortex --locked -- seed-demo demo
      - name: Assemble landing site and live demo
        run: |
          mkdir -p dist/screenshots
          cp -r site/. dist/
          cp web/favicon.ico web/favicon.svg web/logo.svg web/apple-touch-icon.png dist/
          cp assets/social-preview.jpg dist/social-preview.jpg
          cp docs/screenshots/medium/*.jpg dist/screenshots/
          cp docs/screenshots/v1-decision-trail.jpg dist/screenshots/decision-trail.jpg
          cargo run --release -p cortex --locked -- export demo --out dist/demo --title "Cortex Demo"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
