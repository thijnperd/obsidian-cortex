name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Linux and Windows build in a couple of minutes and always get runners, so
  # whatever produces the download must not wait for anything else.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
          - os: windows-latest
            target: windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Build
        run: cargo build --release -p cortex --locked

      # One archive per platform, containing the single self-contained binary.
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p out/cortex
          cp target/release/cortex out/cortex/cortex
          cp README.md out/cortex/README.md
          tar -czf "cortex-${{ matrix.target }}.${{ matrix.archive }}" -C out cortex
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/cortex | Out-Null
          Copy-Item target/release/cortex.exe out/cortex/cortex.exe
          Copy-Item README.md out/cortex/README.md
          Compress-Archive -Path out/cortex -DestinationPath "cortex-${{ matrix.target }}.${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ matrix.target }}
          path: cortex-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  # macOS runners on this account can take tens of minutes to be assigned, or
  # never arrive. Its build is its own job so the download never waits on it:
  # the archive is added to the release by `publish-macos` once it finishes.
  build-macos:
    name: build (macos-arm64)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Build
        run: cargo build --release -p cortex --locked
      - name: Package (unix)
        run: |
          mkdir -p out/cortex
          cp target/release/cortex out/cortex/cortex
          cp README.md out/cortex/README.md
          tar -czf cortex-macos-arm64.tar.gz -C out cortex
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-macos-arm64
          path: cortex-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attach binaries to the version release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # macOS is missing if its runner never arrived; the tag still ships.
          fail_on_unmatched_files: false

  # Every push to main refreshes one moving `latest` release, so there is always
  # a binary to download without cutting a version tag.
  publish-latest:
    name: refresh the rolling latest download
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Cortex — latest build
          target_commitish: main
          make_latest: true
          body: |
            Rolling build of `main`. Download the archive for your platform, unpack
            it, and run `cortex` — it opens the folder picker:

            ```
            cortex
            ```

            Or open your Obsidian vault directly:

            ```
            cortex serve ~/Documents/MyVault --open
            ```

            Linux and macOS builds are unsigned; macOS needs
            `xattr -d com.apple.quarantine ./cortex` once after unpacking.

            The macOS archive is attached a little later than the others: its
            runner is queued, and the download is not held back waiting for it.
          files: artifacts/*
          fail_on_unmatched_files: false

  # Adds the macOS archive to the release `publish-latest` just created, so a
  # slow macOS queue costs only its own job, never the download.
  publish-macos:
    name: attach the macOS binary when it is ready
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-latest, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cortex-macos-arm64
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload latest cortex-macos-arm64.tar.gz --clobber
