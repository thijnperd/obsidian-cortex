name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
          - os: macos-latest
            target: macos-arm64
            archive: tar.gz
          - os: windows-latest
            target: windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Build
        run: cargo build --release -p cortex --locked

      # One archive per platform, containing the single self-contained binary.
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p out/cortex
          cp target/release/cortex out/cortex/cortex
          cp README.md out/cortex/README.md
          tar -czf "cortex-${{ matrix.target }}.${{ matrix.archive }}" -C out cortex
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/cortex | Out-Null
          Copy-Item target/release/cortex.exe out/cortex/cortex.exe
          Copy-Item README.md out/cortex/README.md
          Compress-Archive -Path out/cortex -DestinationPath "cortex-${{ matrix.target }}.${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ matrix.target }}
          path: cortex-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: attach binaries to the version release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Every push to main refreshes one moving `latest` release, so there is always
  # a binary to download without cutting a version tag.
  publish-latest:
    name: refresh the rolling latest download
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Cortex — latest build
          target_commitish: main
          make_latest: true
          body: |
            Rolling build of `main`. Download the archive for your platform, unpack
            it, and run `cortex` — it opens the folder picker:

            ```
            cortex
            ```

            Or open your Obsidian vault directly:

            ```
            cortex serve ~/Documents/MyVault --open
            ```

            Linux and macOS builds are unsigned; macOS needs
            `xattr -d com.apple.quarantine ./cortex` once after unpacking.
          files: artifacts/*
          fail_on_unmatched_files: true
