name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Linux and Windows build in a couple of minutes and always get runners, so
  # whatever produces the download must not wait for anything else.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            archive: tar.gz
          - os: windows-latest
            target: windows-x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "CORTEX_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "CORTEX_VERSION=$version+${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Build
        run: cargo build --release -p cortex --locked

      # One archive per platform, containing the single self-contained binary.
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p out/cortex
          cp target/release/cortex out/cortex/cortex
          cp README.md out/cortex/README.md
          tar -czf "cortex-${{ matrix.target }}.${{ matrix.archive }}" -C out cortex
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/cortex | Out-Null
          Copy-Item target/release/cortex.exe out/cortex/cortex.exe
          Copy-Item README.md out/cortex/README.md
          Compress-Archive -Path out/cortex -DestinationPath "cortex-${{ matrix.target }}.${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ matrix.target }}
          path: cortex-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

      # Per-user installer (no admin). The zip stays for people who want it.
      - name: Installer
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" "installer\cortex.iss"
      - uses: actions/upload-artifact@v4
        if: matrix.archive == 'zip'
        with:
          name: cortex-windows-installer
          path: dist/CortexSetup-*.exe
          if-no-files-found: error
          retention-days: 7

  # macOS runners on this account can take tens of minutes to be assigned, or
  # never arrive. Its build is its own job so the download never waits on it:
  # the archive is added to the release by `publish-macos` once it finishes.
  build-macos:
    name: build (macos-arm64)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Build
        run: cargo build --release -p cortex --locked
      # A bare binary has no identity, icon or normal signing shape on macOS;
      # the archive is an app bundle so Finder and the Dock see Cortex.
      - name: Package (macos app)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app="Cortex.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/cortex "$app/Contents/MacOS/cortex"
          cp assets/icons/cortex.icns "$app/Contents/Resources/cortex.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>cortex</string>
            <key>CFBundleIdentifier</key><string>dev.cortex.app</string>
            <key>CFBundleName</key><string>Cortex</string>
            <key>CFBundleDisplayName</key><string>Cortex</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>CFBundleIconFile</key><string>cortex.icns</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSRequiresAquaSystemAppearance</key><false/>
          </dict>
          </plist>
          PLIST
          # Ad-hoc signing is what lets an arm64 bundle run at all; it is not a
          # substitute for a Developer ID certificate and notarization.
          codesign --force --sign - "$app"
          tar -czf cortex-macos-arm64.tar.gz "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-macos-arm64
          path: cortex-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  # A release whose tag and Cargo.toml disagree is a release that lies about
  # its own version. Fail before anything is attached.
  verify-version:
    name: tag matches Cargo.toml
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml ($version)"
            exit 1
          }

  publish:
    name: attach binaries to the version release
    if: startsWith(github.ref, 'refs/tags/v')
    # Not build-macos: a queued macOS runner must never hold back a release.
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # macOS is missing if its runner never arrived; the tag still ships.
          fail_on_unmatched_files: false

  # Every push to main refreshes one moving `latest` release, so there is always
  # a binary to download without cutting a version tag.
  publish-latest:
    name: refresh the rolling latest download
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Cortex — latest build
          target_commitish: main
          make_latest: true
          body: |
            Rolling build of `main`. Download the archive for your platform, unpack
            it, and run `cortex` — it opens the folder picker:

            ```
            cortex
            ```

            Or open your Obsidian vault directly:

            ```
            cortex serve ~/Documents/MyVault --open
            ```

            Linux and macOS builds are unsigned; macOS needs
            `xattr -d com.apple.quarantine ./cortex` once after unpacking.

            The macOS archive is attached a little later than the others: its
            runner is queued, and the download is not held back waiting for it.
          files: artifacts/*
          fail_on_unmatched_files: false

  # Adds the macOS archive to whichever release was just created, so a slow
  # macOS queue costs only its own job, never the download.
  publish-macos:
    name: attach the macOS binary when it is ready
    if: always() && needs.build-macos.result == 'success' && (needs.publish.result == 'success' || needs.publish-latest.result == 'success')
    needs: [build-macos, publish, publish-latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cortex-macos-arm64
      - name: Attach to the version release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" cortex-macos-arm64.tar.gz --clobber
      - name: Attach to the rolling latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload latest cortex-macos-arm64.tar.gz --clobber
