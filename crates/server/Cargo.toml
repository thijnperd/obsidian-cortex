[package]
name = "cortex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cortex — a local-first Markdown vault with a 3D knowledge universe"

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
cortex-core = { path = "../core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "signal", "sync", "process"] }
clap = { version = "4", features = ["derive"] }
rust-embed = "8"

# The tray needs a native event loop. Linux deliberately has neither, so the
# binary there stays free of GTK, appindicator and Wayland headers.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.19"
winit = "0.30"

# The real folder dialog exists on Windows; macOS and Linux use their own
# picker command instead of linking a GUI toolkit.
[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[dev-dependencies]
tempfile = "3"
