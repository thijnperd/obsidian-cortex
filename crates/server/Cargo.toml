[package]
name = "cortex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cortex — a local-first Markdown vault with a 3D knowledge universe"

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
cortex-core = { path = "../core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "signal", "sync"] }
clap = { version = "4", features = ["derive"] }
rust-embed = "8"
