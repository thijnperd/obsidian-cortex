[package]
name = "cortex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cortex — a local-first Markdown vault with a 3D knowledge universe"

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
cortex-core = { path = "../core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "signal", "sync", "process"] }
clap = { version = "4", features = ["derive"] }
rust-embed = "8"

# A real window on the platforms that ship one: WebView2 on Windows and
# WKWebView on macOS. Linux deliberately keeps the browser path so the binary
# does not link WebKitGTK, GTK and libsoup just to start.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = "0.57"
tao = "0.37"
tray-icon = "0.26"

# The real folder dialog exists on Windows; macOS and Linux use their own
# picker command instead of linking a GUI toolkit.
[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"
